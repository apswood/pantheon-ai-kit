#config-version=FGT60F-7.2.8-FW-build1639-240101:opmode=0:vdom=0
# SYNTHETIC SAMPLE for the PANTHEON kit. Not a real device. Addresses use documentation ranges
# (RFC 5737). All secrets are <REDACTED>. Intentionally contains weak settings for AEGIS to find.
config system global
    set hostname "SAMPLE-FW-01"
    set admin-sport 443
    set admin-ssh-port 22
    set admintimeout 480
    set admin-telnet enable
    set strong-crypto disable
    set timezone 00
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping https ssh http telnet
        set role wan
    next
    edit "lan"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC <REDACTED>
    next
    edit "svc-backup"
        set accprofile "super_admin"
        set password ENC <REDACTED>
        set trusthost1 0.0.0.0 0.0.0.0
    next
end
config system snmp community
    edit 1
        set name "<REDACTED>"
        set status enable
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end
config firewall policy
    edit 1
        set name "lan-to-internet"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
    next
    edit 2
        set name "any-to-dmz-web"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "web-server-vip"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic utm
    next
end
config vpn ipsec phase1-interface
    edit "branch-a"
        set interface "wan1"
        set ike-version 1
        set proposal aes128-sha1 3des-md5
        set dhgrp 2
        set psksecret ENC <REDACTED>
        set remote-gw 203.0.113.10
    next
end
config log syslogd setting
    set status disable
end
